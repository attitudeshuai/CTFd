<form id="team-captain-form" method="POST">
	<input type="hidden" name="id">
	<div class="form-group">
		<label for="captain">Team Captain</label>
		<select class="form-control custom-select" id="captain" name="captain_id">
			{% if team is defined %}
				{% if team.captain is none %}
					<option value="" selected disabled>-- select a captain --</option>
				{% endif %}
				{% for member in team.members %}
					<option value="{{ member.id }}"{% if team.captain_id == member.id %} selected{% endif %}>{{ member.name }}</option>
				{% endfor %}
			{% endif %}
		</select>
	</div>
	<div id="results">

	</div>
	<button type="submit" class="btn btn-primary btn-outlined float-right modal-action">
		Submit
	</button>
</form>
